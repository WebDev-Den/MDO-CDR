[workspace]
members = [
    ".",
    "crates/defender-core",
    "crates/defender-signatures",
    "crates/defender-observability",
    "crates/defender-ffi",
    "crates/defender-handlers-media",
]

[package]
name = "mdo_cdr"
version = "0.1.0"
edition = "2024"
description = "Rust library for controlled structural reconstruction of multimedia digital objects (CDR pipeline) for end-device protection"
documentation = "https://docs.rs/mdo_cdr"
readme = "README.md"
license = "MIT"

[lib]
crate-type = ["lib", "cdylib", "staticlib"]

[dependencies]
aho-corasick = "1.1"
arc-swap = "1.7.1"
defender-core = { version = "0.1.0", path = "crates/defender-core" }
defender-ffi = { version = "0.1.0", path = "crates/defender-ffi" }
defender-handlers-media = { version = "0.1.0", path = "crates/defender-handlers-media" }
defender-observability = { version = "0.1.0", path = "crates/defender-observability" }
defender-signatures = { version = "0.1.0", path = "crates/defender-signatures" }
gif = "0.13.3"
hex = "0.4.3"
hmac = "0.12.1"
image = { version = "0.25.8", default-features = false, features = ["bmp", "gif", "jpeg", "png", "tiff", "webp"] }
infer = "0.16.0"
log = "0.4"
prost = { version = "0.14.1", features = ["derive"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.145"
sha2 = "0.10.9"
symphonia = { version = "0.5.5", features = ["aac", "flac", "isomp4", "mp3", "ogg", "pcm", "vorbis", "wav"] }
tempfile = "3.15.0"
thiserror = "2.0.12"

[dev-dependencies]
criterion = "0.5.1"
flate2 = "1.1.9"

# Defense guarantee: panic must unwind so FileDefender can wrap handlers in
# catch_unwind against malformed input from parsers. Consumers compiling with
# panic = "abort" will NOT receive runtime panic safety — this is part of the
# crate's defense contract.
[profile.release]
panic = "unwind"

[profile.dev]
panic = "unwind"

[[bench]]
name = "pipeline_bench"
harness = false

[[bench]]
name = "mime_policy_scale_bench"
harness = false
