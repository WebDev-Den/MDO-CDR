name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  version:
    name: Check release version
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - name: Require a tag matching Cargo.toml
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          python3 - <<'PY'
          import os
          import tomllib
          with open('Cargo.toml', 'rb') as source:
              version = tomllib.load(source)['package']['version']
          expected = f'v{version}'
          if os.environ['RELEASE_TAG'] != expected:
              raise SystemExit(f'Release tag must be {expected}')
          PY

  verify:
    name: Verify release
    needs: version
    uses: ./.github/workflows/ci.yml

  publish:
    name: Publish tested packages
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Download packages from this CI run
        uses: actions/download-artifact@v8.0.1
        with:
          pattern: MDO-CDR-*
          path: release-assets
          merge-multiple: true
      - name: Check package checksums
        working-directory: release-assets
        run: |
          test "$(find . -maxdepth 1 -name '*.sha256' | wc -l)" -eq 3
          sha256sum --check ./*.sha256
      - name: Create release only after successful verification
        uses: softprops/action-gh-release@v3.0.3
        with:
          name: MDO-CDR ${{ github.ref_name }}
          generate_release_notes: true
          prerelease: ${{ contains(github.ref_name, '-') }}
          fail_on_unmatched_files: true
          files: |
            release-assets/*.zip
            release-assets/*.tar.gz
            release-assets/*.sha256
